name: Slither Analysis

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: src/
          slither-args: --filter-paths "lib/"
